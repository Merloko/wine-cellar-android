name: Release APK

# Publishes an installable APK to a GitHub Release. Trigger it either by
# pushing a version tag (git tag v1.0 && git push origin v1.0) or by running
# the workflow manually and supplying a tag name.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.0)'
        required: true

permissions:
  contents: write   # needed to create the Release and upload the APK

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      # Sign the release build when the WINE_* secrets are configured; otherwise
      # fall back to the debug APK. This matters for GitHub distribution: an
      # unsigned release APK will not install, whereas a debug APK is signed with
      # the auto-generated debug key and installs fine when sideloaded.
      - name: Check for signing secrets
        id: signing
        env:
          WINE_KEYSTORE_BASE64: ${{ secrets.WINE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$WINE_KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No WINE_KEYSTORE_BASE64 secret set — releasing the debug APK (installable, debug-signed)."
          fi

      - name: Decode keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          WINE_KEYSTORE_BASE64: ${{ secrets.WINE_KEYSTORE_BASE64 }}
        run: echo "$WINE_KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build APK
        id: build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.WINE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WINE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WINE_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            gradle assembleRelease --no-daemon
            apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          else
            gradle assembleDebug --no-daemon
            apk=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          fi
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "Built: $apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.build.outputs.apk }}
          fail_on_unmatched_files: true
