name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.6'

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Android Lint
        run: gradle lintDebug --no-daemon

      - name: detekt (static analysis)
        run: gradle detekt --no-daemon

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: analysis-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/detekt/*
          retention-days: 30

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: wine-cellar-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # ---- Signed release (only when signing secrets are configured) ----
      # Add these repo secrets to enable a signed build:
      #   WINE_KEYSTORE_BASE64, WINE_KEYSTORE_PASSWORD, WINE_KEY_ALIAS, WINE_KEY_PASSWORD
      - name: Check for signing secrets
        id: signing
        env:
          WINE_KEYSTORE_BASE64: ${{ secrets.WINE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$WINE_KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No WINE_KEYSTORE_BASE64 secret set — skipping signed release build."
          fi

      - name: Decode keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          WINE_KEYSTORE_BASE64: ${{ secrets.WINE_KEYSTORE_BASE64 }}
        run: echo "$WINE_KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.WINE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WINE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WINE_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: wine-cellar-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
