name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Android Lint
        run: gradle lintDebug --no-daemon

      - name: detekt (static analysis)
        run: gradle detekt --no-daemon

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: analysis-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/detekt/*
          retention-days: 30

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: wine-cellar-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # ---- Release build ----
      # assembleRelease always runs so R8/resource shrinking is validated on every
      # build. It is signed only when these repo secrets are configured, and only
      # the signed APK is uploaded:
      #   WINE_KEYSTORE_BASE64, WINE_KEYSTORE_PASSWORD, WINE_KEY_ALIAS, WINE_KEY_PASSWORD
      - name: Check for signing secrets
        id: signing
        env:
          WINE_KEYSTORE_BASE64: ${{ secrets.WINE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$WINE_KEYSTORE_BASE64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No WINE_KEYSTORE_BASE64 secret set — release APK will be built unsigned (R8 still validated)."
          fi

      - name: Decode keystore
        if: steps.signing.outputs.enabled == 'true'
        env:
          WINE_KEYSTORE_BASE64: ${{ secrets.WINE_KEYSTORE_BASE64 }}
        run: echo "$WINE_KEYSTORE_BASE64" | base64 -d > app/release.keystore

      # Build both the APK (sideloading) and the AAB (App Bundle — the format
      # Google Play requires for uploads). Both validate R8/resource shrinking;
      # both are signed only when the WINE_* secrets are set.
      - name: Build release APK + AAB (validates R8; signed when secrets are set)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.WINE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WINE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WINE_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon

      - name: Upload signed release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: wine-cellar-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload signed release AAB (upload this to Google Play)
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: wine-cellar-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
