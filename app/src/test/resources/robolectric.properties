# The app targets API 36, but Robolectric 4.11.1 ships Android runtimes only up
# to API 34, so its default (run against targetSdk) can't find an API-36 runtime
# and every Robolectric test fails at init (DefaultSdkPicker). Pin the emulated
# runtime to 34 — these are pure logic / Room tests that don't exercise any
# API-35/36 behaviour. Bump Robolectric later to test on a newer runtime.
sdk=34
